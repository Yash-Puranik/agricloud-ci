<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriCloud-CI | Crop Advisory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">AgriCloud-CI Platform</h1>
            <nav class="space-x-6 text-sm font-medium">
                <a href="index.html" class="hover:text-blue-200">Dashboard</a>
                <a href="advisory.html" class="text-blue-200 border-b-2 border-blue-400 pb-1">Crop Advisory</a>
                <a href="history.html" class="hover:text-blue-200">Audit History</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold text-slate-900 mb-6">Target Crop Viability Evaluation</h2>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
            <label class="block text-sm font-bold text-slate-700 mb-2">Select Crop Variety</label>
            <select id="crop-select" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="Wheat">Wheat (Triticum aestivum)</option>
                <option value="Cotton">Cotton (Gossypium hirsutum)</option>
                <option value="Soybeans">Soybeans (Glycine max)</option>
            </select>
            <button id="evaluate-btn" class="mt-4 px-6 py-2.5 bg-blue-900 text-white font-semibold rounded-lg hover:bg-blue-800">
                Evaluate Viability
            </button>
        </div>

        <div id="result-box" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-4">
                <h3 id="res-crop" class="text-lg font-bold text-slate-900">Wheat</h3>
                <span id="res-badge" class="px-3 py-1 rounded-full text-xs font-bold uppercase">Optimal</span>
            </div>
            <p id="res-advisory" class="text-sm text-slate-700 leading-relaxed"></p>
            <ul id="res-violations" class="mt-4 space-y-1 text-xs text-red-600"></ul>
        </div>
    </main>

    <script>
        document.getElementById("evaluate-btn").addEventListener("click", async () => {
            const crop = document.getElementById("crop-select").value;

            let temp = Number(localStorage.getItem("agricloud_temp"));
            let hum = Number(localStorage.getItem("agricloud_hum"));
            let soil = Number(localStorage.getItem("agricloud_soil")) || 54.0;

            if (!temp || !hum) {
                try {
                    const liveRes = await fetch("http://127.0.0.1:5000/api/telemetry/live", { cache: "no-store" });
                    const liveData = await liveRes.json();
                    temp = Number(liveData.temperature);
                    hum = Number(liveData.humidity);
                } catch (_) {
                    temp = 24.5;
                    hum = 60.0;
                }
            }

            const rules = {
                Wheat:    { minSoil: 45, maxSoil: 65, minTemp: 12, maxTemp: 32, minHum: 35, maxHum: 80 },
                Cotton:   { minSoil: 40, maxSoil: 60, minTemp: 18, maxTemp: 38, minHum: 40, maxHum: 75 },
                Soybeans: { minSoil: 50, maxSoil: 70, minTemp: 15, maxTemp: 34, minHum: 45, maxHum: 85 }
            };
            const r = rules[crop] || rules.Wheat;
            const violations = [];

            if (soil < r.minSoil) violations.push(`Soil moisture (${soil.toFixed(1)}%) below optimal minimum (${r.minSoil}%).`);
            if (soil > r.maxSoil) violations.push(`Soil moisture (${soil.toFixed(1)}%) exceeds saturation limit (${r.maxSoil}%).`);
            if (temp < r.minTemp || temp > r.maxTemp) violations.push(`Ambient temperature (${temp.toFixed(1)}°C) outside nominal range (${r.minTemp}°C–${r.maxTemp}°C).`);
            if (hum < r.minHum || hum > r.maxHum) violations.push(`Relative humidity (${hum.toFixed(1)}%) outside optimal band (${r.minHum}%–${r.maxHum}%).`);

            let verdict = "Optimal";
            let advisory = `Optimal — Current field microclimate (${temp.toFixed(1)}°C, ${hum.toFixed(1)}% RH, ${soil.toFixed(1)}% soil moisture) supports healthy ${crop} cultivation.`;

            if (soil < r.minSoil) {
                verdict = "Critical";
                advisory = `Critical — Immediate irrigation required for ${crop}. Soil moisture has dropped below critical root-zone threshold.`;
            } else if (violations.length > 0) {
                verdict = "Marginal";
                advisory = `Marginal — ${crop} is viable with active monitoring, but one or more microclimate parameters sit outside ideal bounds.`;
            }

            try {
                await fetch("http://127.0.0.1:5000/api/telemetry", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ temperature: temp, humidity: hum, soil_moisture: soil, crop: crop })
                });
            } catch (_) {}

            const history = JSON.parse(localStorage.getItem("agricloud_history") || "[]");
            history.unshift({
                id: Date.now().toString().slice(-4),
                timestamp: new Date().toISOString(),
                node_id: "ESP32-NODE-01",
                temperature: temp,
                humidity: hum,
                soil_moisture: soil,
                crop: crop,
                verdict: verdict
            });
            localStorage.setItem("agricloud_history", JSON.stringify(history.slice(0, 30)));

            document.getElementById("result-box").classList.remove("hidden");
            document.getElementById("res-crop").innerText = crop;
            document.getElementById("res-advisory").innerText = advisory;

            const badge = document.getElementById("res-badge");
            badge.innerText = verdict;
            badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase " +
                (verdict === "Optimal" ? "bg-emerald-100 text-emerald-800" :
                 verdict === "Marginal" ? "bg-amber-100 text-amber-800" : "bg-red-100 text-red-800");

            const violList = document.getElementById("res-violations");
            violList.innerHTML = "";
            violations.forEach(v => {
                const li = document.createElement("li");
                li.innerText = "• " + v;
                violList.appendChild(li);
            });
        });
    </script>
</body>
</html>
