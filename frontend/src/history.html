<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriCloud-CI | Audit History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">AgriCloud-CI Platform</h1>
            <nav class="space-x-6 text-sm font-medium">
                <a href="index.html" class="hover:text-blue-200">Dashboard</a>
                <a href="advisory.html" class="hover:text-blue-200">Crop Advisory</a>
                <a href="history.html" class="text-blue-200 border-b-2 border-blue-400 pb-1">Audit History</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold text-slate-900 mb-6">Historical Telemetry Ingestion Log</h2>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider border-b border-slate-200">
                        <th class="p-4">Timestamp</th>
                        <th class="p-4">Node ID</th>
                        <th class="p-4">Temp (°C)</th>
                        <th class="p-4">Humidity (%)</th>
                        <th class="p-4">Soil (%)</th>
                        <th class="p-4">Crop</th>
                        <th class="p-4">Verdict</th>
                    </tr>
                </thead>
                <tbody id="history-rows" class="text-sm divide-y divide-slate-100">
                    <tr><td colspan="7" class="p-4 text-center text-slate-400">Loading audit records...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const tableBody = document.getElementById("history-rows");

            async function renderHistory() {
                let records = JSON.parse(localStorage.getItem("agricloud_history") || "[]");

                try {
                    const res = await fetch("http://127.0.0.1:5000/api/history?limit=15", { cache: "no-store" });
                    if (res.ok) {
                        const data = await res.json();
                        const backendList = Array.isArray(data) ? data : (data.records || []);
                        if (records.length === 0 && backendList.length > 0) {
                            records = backendList;
                        }
                    }
                } catch (e) {
                    if (records.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-red-500">Failed to connect to history endpoint (Ensure Flask is running on :5000).</td></tr>';
                        return;
                    }
                }

                if (records.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-slate-400">No records found. Open Dashboard first to stream telemetry.</td></tr>';
                    return;
                }

                tableBody.innerHTML = "";
                records.slice(0, 15).forEach(r => {
                    const verdict = r.verdict || r.suitability_verdict || (Number(r.soil_moisture) < 45 ? "Critical" : Number(r.soil_moisture) > 65 ? "Marginal" : "Optimal");
                    const cropName = r.crop || r.crop_queried || "Wheat";
                    const nodeId = r.node_id || "ESP32-NODE-01";

                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-slate-50";
                    tr.innerHTML = `
                        <td class="p-4 text-slate-500">${new Date(r.timestamp).toLocaleString()}</td>
                        <td class="p-4 font-mono text-xs font-semibold">${nodeId}</td>
                        <td class="p-4">${parseFloat(r.temperature).toFixed(1)}</td>
                        <td class="p-4">${parseFloat(r.humidity).toFixed(1)}</td>
                        <td class="p-4">${parseFloat(r.soil_moisture).toFixed(1)}</td>
                        <td class="p-4 font-medium">${cropName}</td>
                        <td class="p-4">
                            <span class="px-2 py-0.5 rounded text-xs font-bold uppercase ${
                                verdict === 'Optimal' ? 'bg-emerald-100 text-emerald-800' :
                                verdict === 'Marginal' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'
                            }">${verdict}</span>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            }

            renderHistory();
            setInterval(renderHistory, 5000);
        });
    </script>
    
</body>
</html>
